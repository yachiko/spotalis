name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v6
        with:
          go-version-file: go.mod

      - name: Verify go.mod and go.sum
        run: make deps

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@17ebc353996a2841dc0b207c184c1722a219b928  # v9
        with:
          version: v2.13.2

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v6
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: make deps

      - name: Build application
        run: make build

      - name: Run unit tests
        run: make test
