name: Integration Tests

on:
  # Always run after merge so main has end-to-end validation before release.
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    # A labeled event starts the suite; synchronize reruns it while the label
    # remains present.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # Publish calls this workflow so its image is only released after the same
  # full Kind validation succeeds.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-integration')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Build docker image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b  # v7
        with:
          set: |
            *.tags=spotalis:local
            *.platform=linux/amd64
            *.output=type=docker,dest=${{ runner.temp }}/spotalis.tar

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: spotalis
          path: ${{ runner.temp }}/spotalis.tar

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v6
        with:
          go-version-file: go.mod

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: spotalis
          path: ${{ runner.temp }}

      - name: Load image
        run: |
          docker load --input ${{ runner.temp }}/spotalis.tar
          docker tag spotalis:local ghcr.io/yachiko/spotalis:latest
          docker image ls -a

      - name: Set up Kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1
        with:
          install_only: true

      - name: Create Kind cluster
        run: make kind

      - name: Load Docker image to Kind
        run: kind load docker-image ghcr.io/yachiko/spotalis:latest --name spotalis

      - name: Deploy Spotalis
        run: make deploy

      - name: Run integration tests
        run: make test-integration
